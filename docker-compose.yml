# Production-like local stack: PostgreSQL (stands in for RDS) + MinIO (stands in for S3) + the app image.
#   docker compose up --build        → http://localhost:3000
#   docker compose run --rm app node scripts/seed.js     (demo staff accounts)
# MinIO console: http://localhost:9001 (minioadmin / minioadmin). Development only: never use these credentials elsewhere.
services:
  db:
    image: postgres:17
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: uyir }
    ports: ['5433:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U postgres'], interval: 5s, retries: 10 }

  s3:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ['9000:9000', '9001:9001']
    volumes: [s3data:/data]
    healthcheck: { test: ['CMD', 'mc', 'ready', 'local'], interval: 5s, retries: 10 }

  s3-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: { s3: { condition: service_healthy } }
    entrypoint: ['sh', '-c', 'mc alias set local http://s3:9000 minioadmin minioadmin && mc mb --ignore-existing local/uyir-documents']

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
    ports: ['3000:3000']
    environment:
      NODE_ENV: development          # production mode requires HTTPS PUBLIC_URL and real secrets
      PORT: '3000'
      PUBLIC_URL: http://localhost:3000
      DATABASE_URL: postgres://postgres:postgres@db:5432/uyir
      STORAGE_DRIVER: s3
      S3_BUCKET: uyir-documents
      S3_ENDPOINT: http://s3:9000
      S3_SSE: none                    # MinIO has no KMS here; production always uses aws:kms
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      HEALTH_CHECK_STORAGE: '1'

volumes:
  pgdata:
  s3data:
