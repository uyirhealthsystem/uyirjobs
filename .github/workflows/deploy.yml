# CI/CD for Uyir nurse registration.
#   Every push / pull request: run the test suite against a real PostgreSQL, lint the infrastructure.
#   Push to main: build the container, push it to ECR, deploy with CloudFormation (infra/app.yml)
#   to ECS Fargate. ECS rolls out new tasks only when they pass health checks, and rolls back a bad release.
#
# One-time setup (docs/DEPLOYMENT-AWS.md):
#   1. Deploy infra/bootstrap.yml, then set these repository variables (Settings → Secrets and variables → Actions → Variables):
#        AWS_DEPLOY_ROLE_ARN, CFN_EXECUTION_ROLE_ARN   (bootstrap stack outputs)
#   2. Fill in infra/prod.params.json (certificate ARN, WhatsApp Business number).
#   3. Create a GitHub environment named "production" (optionally with required reviewers).
# No AWS keys are stored in GitHub: the deploy job gets short-lived credentials through OIDC.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: uyir-nurse-registration
  STACK_NAME: uyir-prod

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uyir_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - name: Install
        run: |
          npm --prefix server ci
          npm --prefix web ci
      - name: Build React app
        run: npm --prefix web run build
      - name: API tests (Express + PostgreSQL + S3 stand-in)
        run: npm --prefix server test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/uyir_test
      - name: Audit production dependencies
        run: |
          npm --prefix server audit --omit=dev --audit-level=high
          npm --prefix web audit --omit=dev --audit-level=high

  lint-infra:
    name: Lint CloudFormation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cfn-lint==1.*
      - run: cfn-lint --regions ap-south-1 -- infra/*.yml

  deploy:
    name: Build & deploy to AWS
    needs: [test, lint-infra]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false        # never interrupt a running CloudFormation update
    permissions:
      contents: read
      id-token: write                  # OIDC → AWS
    steps:
      - uses: actions/checkout@v4

      - name: Check production settings are filled in
        run: |
          if grep -q 'REPLACE_ME' infra/prod.params.json; then
            echo "::error file=infra/prod.params.json::Fill in the REPLACE_ME values (certificate ARN, WhatsApp Business number) before deploying."
            exit 1
          fi
          for v in AWS_DEPLOY_ROLE_ARN CFN_EXECUTION_ROLE_ARN; do
            [ -n "${!v}" ] || { echo "::error::Repository variable $v is not set (see docs/DEPLOYMENT-AWS.md)"; exit 1; }
          done
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          CFN_EXECUTION_ROLE_ARN: ${{ vars.CFN_EXECUTION_ROLE_ARN }}

      - name: AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Image for $GITHUB_SHA already exists (re-run); skipping build."
          else
            docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$IMAGE" .
            docker push "$IMAGE"
          fi
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy (CloudFormation → ECS rolling update)
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          CFN_ROLE: ${{ vars.CFN_EXECUTION_ROLE_ARN }}
        run: |
          mapfile -t PARAMS < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' infra/prod.params.json)
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infra/app.yml \
            --role-arn "$CFN_ROLE" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${PARAMS[@]}" "ImageUri=$IMAGE_URI" \
            --tags app=uyir commit="$GITHUB_SHA"

      - name: Show what went wrong
        if: failure()
        run: |
          aws cloudformation describe-stack-events --stack-name "$STACK_NAME" --max-items 25 \
            --query "StackEvents[?contains(ResourceStatus, 'FAILED')].[Timestamp,LogicalResourceId,ResourceStatusReason]" --output table || true

      - name: Smoke test
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='Url'].OutputValue" --output text)
          echo "Deployed: $URL"
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 "$URL/healthz"; then echo; exit 0; fi
            sleep 15
          done
          echo "::warning::$URL/healthz did not answer (DNS may not point at the load balancer yet)."
